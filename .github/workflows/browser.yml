name: Browser bundle

on:
  push:
    branches: [main]
    paths: ['ts/**', '.github/workflows/browser.yml']
  pull_request:
    paths: ['ts/**', '.github/workflows/browser.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm test
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npx playwright install --with-deps chromium webkit
        working-directory: ts
      - run: npm run test:browser
        working-directory: ts
      - uses: actions/upload-artifact@v4
        with:
          name: hubnot-public
          path: public/
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Refuse to publish an outdated build
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Remove previous generated bundle
        run: rm -rf public/
      - uses: actions/download-artifact@v4
        with:
          name: hubnot-public
          path: public/
      - name: Commit generated public directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build browser bundle in public/ [skip ci]'
          git push origin HEAD:main
